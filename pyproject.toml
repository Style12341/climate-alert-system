[project]
name = "climate-alerts"
version = "0.1.0"
description = "Climate alert system: FastAPI, async SQLAlchemy, PostgreSQL"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi~=0.162",
    "uvicorn~=0.54",
    "sqlalchemy[asyncio]~=2.1",
    "asyncpg~=0.32",
    "alembic~=1.20",
    "apscheduler>=3.11,<4",
    "pyjwt~=2.15",
    "pydantic-settings~=2.16",
    "structlog>=26,<27",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio~=1.4",
    "testcontainers[postgres]~=4.15",
    "httpx",
    "asgi-lifespan",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climate_alerts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.text".msg = "Use the SQLAlchemy expression language."
"sqlalchemy.orm.Query".msg = "Legacy API. Use select()."
"sqlalchemy.orm.declarative_base".msg = "Use DeclarativeBase."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "TID251"]
"migrations/**" = ["TID251"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
