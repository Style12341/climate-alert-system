# Local development and review stack: `docker compose up` needs no setup.
#
# DEVELOPMENT ONLY: POSTGRES_PASSWORD, the password inside DATABASE_URL and
# JWT_SECRET below are public values for local use. Never deploy with them.
# The application itself has no default for either secret.

name: climate-alert-system

x-build: &build
  image: climate-alerts:dev
  build: .

x-database-url: &database-url
  DATABASE_URL: postgresql+asyncpg://climate:local-dev-only-password@db:5432/climate_alerts

x-app-environment: &app-environment
  <<: *database-url
  JWT_SECRET: local-development-only-jwt-secret-do-not-deploy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: climate
      POSTGRES_PASSWORD: local-dev-only-password
      POSTGRES_DB: climate_alerts
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h is required. During first-time init the image runs a temporary
      # server on the Unix socket only, and without -h pg_isready reports that
      # one as ready, so migrate would connect just as it shuts down.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "climate", "-d", "climate_alerts"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *build
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-url
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *build
    command: ["python", "-m", "climate_alerts.agrobot.seed"]
    environment:
      <<: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *build
    command: ["uvicorn", "--factory", "climate_alerts.api.app:create_app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully

  worker:
    <<: *build
    command: ["python", "-m", "climate_alerts.worker"]
    environment:
      <<: *app-environment
      NOTIFICATION_CHANNELS: whatsapp,email
    # Above WORKER_SHUTDOWN_TIMEOUT_SECONDS (25), so a drain ends before SIGKILL.
    stop_grace_period: 30s
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  db-data:
